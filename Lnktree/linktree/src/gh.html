<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Pages | Diego Coelho Marcos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 50%, #1a0b2e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: #e0d4f7;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: rgba(26, 11, 46, 0.6);
            border: 1px solid rgba(138, 92, 246, 0.3);
            border-radius: 20px;
            padding: 3rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(138, 92, 246, 0.15);
        }
        header { text-align: center; margin-bottom: 2rem; }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa 0%, #c084fc 50%, #e879f9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }
        .subtitle { font-size: 1.1rem; color: #c4b5fd; font-weight: 300; }
        .gh-list { display: flex; flex-direction: column; gap: 1rem; margin-top: 2rem; }
        .gh-row {
            display: grid;
            grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.6fr) minmax(0, 2fr) auto;
            gap: 1.5rem;
            align-items: center;
            background: rgba(45, 27, 78, 0.5);
            border: 1px solid rgba(168, 139, 250, 0.3);
            border-radius: 16px;
            padding: 1.2rem 1.5rem;
            transition: all 0.3s ease;
        }
        .gh-row:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(138, 92, 246, 0.3);
            border-color: rgba(168, 139, 250, 0.6);
        }
        .gh-name { font-size: 1.1rem; font-weight: 600; color: #c4b5fd; overflow-wrap: anywhere; }
        .gh-name a { color: inherit; text-decoration: none; }
        .gh-name a:hover { text-decoration: underline; }
        .gh-badge {
            display: inline-block; margin-left: 0.5rem; padding: 0.1rem 0.5rem;
            font-size: 0.7rem; border-radius: 999px; color: #e0d4f7;
            border: 1px solid rgba(168, 139, 250, 0.4);
        }
        .gh-url { color: #e879f9; text-decoration: none; overflow-wrap: anywhere; font-size: 0.95rem; }
        .gh-url:hover { text-decoration: underline; }
        .gh-desc { color: #a78bfa; font-size: 0.9rem; overflow-wrap: anywhere; }
        .gh-date { color: #a78bfa; font-size: 0.85rem; white-space: nowrap; }
        .gh-group { margin: 2rem 0 0.2rem; font-size: 1.2rem; color: #c4b5fd; display: flex; align-items: baseline; gap: 0.6rem; }
        .gh-group small { font-size: 0.8rem; color: #8b7bbf; font-weight: 400; }
        .gh-row { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.6fr) minmax(0, 2fr) auto auto; }
        .gh-status { font-size: 0.75rem; padding: 0.15rem 0.6rem; border-radius: 999px; border: 1px solid rgba(110, 231, 183, 0.5); color: #6ee7b7; white-space: nowrap; }
        .gh-status.bad { border-color: rgba(248, 113, 113, 0.7); color: #fca5a5; }
        .gh-row.broken { border-color: rgba(248, 113, 113, 0.5); }
        .gh-empty { text-align: center; color: #a78bfa; padding: 2rem 0; }
        .footer { text-align: center; margin-top: 2rem; }
        .back-button {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid rgba(168, 139, 250, 0.3);
        }
        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.4);
            background: linear-gradient(135deg, #6d28d9 0%, #9333ea 100%);
        }
        .generated { margin-top: 1rem; font-size: 0.75rem; color: #8b7bbf; }
        @media (max-width: 768px) {
            .container { padding: 1.5rem; }
            h1 { font-size: 2rem; }
            .gh-row { grid-template-columns: 1fr; gap: 0.4rem; padding: 1rem; }
            .gh-status { justify-self: start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>GitHub Pages</h1>
            <p class="subtitle">Every site the monorepo publishes, plus separate Pages repos</p>
        </header>
        <div class="gh-list" id="gh-list"></div>
        <div class="footer">
            <a class="back-button" href="./">Back to Linktree</a>
            <p class="generated" id="gh-generated"></p>
        </div>
    </div>
    <!-- Declarative data: generated at build time by scripts/gh-pages-gen.mjs (refreshed daily by .github/workflows/gh-pages-list.yml); no runtime API calls. -->
    <script src="data-gh-pages.json.js"></script>
    <script>
        (function () {
            var data = (globalThis.PORTAL_DATA || {})["gh-pages"] || { sites: [] };
            var list = document.getElementById("gh-list");
            function el(tag, cls, text) {
                var e = document.createElement(tag);
                if (cls) e.className = cls;
                if (text) e.textContent = text;
                return e;
            }
            if (!data.sites.length) list.appendChild(el("p", "gh-empty", "No GitHub Pages sites listed yet."));
            var groups = [], byGroup = {};
            data.sites.forEach(function (s) {
                if (!byGroup[s.group]) { byGroup[s.group] = []; groups.push(s.group); }
                byGroup[s.group].push(s);
            });
            groups.forEach(function (g) {
                var items = byGroup[g], bad = items.filter(function (s) { return !s.ok; }).length;
                var h = el("h2", "gh-group", g);
                h.appendChild(el("small", null, items.length + (items.length === 1 ? " site" : " sites") + (bad ? ", " + bad + " not reachable" : "")));
                list.appendChild(h);
                items.forEach(function (s) {
                    var row = el("div", "gh-row" + (s.ok ? "" : " broken"));
                    var name = el("div", "gh-name");
                    var t = el("a", null, s.title);
                    t.href = s.url; t.target = "_blank"; t.rel = "noopener";
                    name.appendChild(t);
                    var url = el("a", "gh-url", s.url.replace(/^https:\/\//, ""));
                    url.href = s.url; url.target = "_blank"; url.rel = "noopener";
                    row.appendChild(name);
                    row.appendChild(url);
                    row.appendChild(el("div", "gh-desc", s.description));
                    row.appendChild(el("div", "gh-date", s.updated));
                    row.appendChild(el("span", "gh-status" + (s.ok ? "" : " bad"), s.ok ? "200 OK" : (s.status ? "HTTP " + s.status : "unreachable")));
                    list.appendChild(row);
                });
            });
            if (data.generated) document.getElementById("gh-generated").textContent = "List generated " + data.generated + " (status = HTTP result at generation time)";
        })();
    </script>
</body>
</html>
